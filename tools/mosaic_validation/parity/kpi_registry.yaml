# PBI parity registry for the Mosaic Executive Dashboard.
#
# One entry per KPI. Each KPI is checked against a reference:
#   pbi_source_sql : PBI's own import query (edw_dev.bipa_analytics.presentation_mosaicdailyvolume_vw),
#                    with the PBI DAX measure replicated in SQL (column renames per the Daily_Extract
#                    partition M: Mosaic_flag -> [Mosaic Exam Flag], Radiologist -> [Provider],
#                    Case_Count -> [Exam Ct], teamro -> [Team], Practice_Short_Name -> [Practice],
#                    [Date] = DATE(Final_DateTime)). Automated by run_parity.py.
#   dax            : must be executed in PowerBI Desktop (powerbi-authoring-local MCP). Results are
#                    fed to run_parity.py with --dax-results <json>.
#   source_table   : no PBI counterpart; validated against its own source table elsewhere
#                    (validate_program.sql, draftable legacy view).
#
# pbi_expr is a SQL aggregate over alias p (the PBI source view, plus derived columns
# pbi_local / pbi_practice / pbi_month). mv_measure is the governed metric-view measure.
# tolerance: count -> |rel diff| <= 0.05% is NEAR, 0 is MATCH; pct -> |diff| <= 0.0005 (0.05pp).

volume:
  pbi_report: Mosaic Volume Report (CTT Version)
  pbi_table: Daily_Extract
  pbi_source: edw_dev.bipa_analytics.presentation_mosaicdailyvolume_vw
  metric_view: edw_test.enterprise_analytics.mosaic_volume_metric_view
  mv_month: Final Month
  scopes:
    local: {pbi: pbi_local, mv: Local Region}
    managing_practice: {pbi: pbi_practice, mv: Practice (PBI)}
  kpis:
    - id: exams
      label: Clinical exams
      pbi_measure: DynamicClinicalcases (Exam Count)
      pbi_expr: SUM(p.Case_Count)
      mv_measure: Exam Count
      kind: count
    - id: rpce_exams
      label: RPCE exams
      pbi_measure: DynamicRPCECases (Exam Count) = RPCEEXAMS
      pbi_expr: "SUM(CASE WHEN p.Source_System_Code IN ('rpceMidwest','rpceSouthwest') THEN 1 ELSE 0 END)"
      mv_measure: RPCE Exam Count
      kind: count
    - id: mosaic_exams
      label: Mosaic exams (reporting)
      pbi_measure: DynamicMosaicCases (Exam Count) = Mosaic Exam Ct
      pbi_expr: SUM(p.Mosaic_flag)
      mv_measure: Mosaic Exam Count
      kind: count
    - id: pct_rpce_reporting
      label: '% of RPCE (Reporting)'
      pbi_measure: "'% of RPCE'"
      pbi_expr: "SUM(p.Mosaic_flag) / SUM(CASE WHEN p.Source_System_Code IN ('rpceMidwest','rpceSouthwest') THEN 1 ELSE 0 END) + 0.02"
      mv_measure: Pct RPCE Reporting
      kind: pct
    - id: drafting_exams
      label: Mosaic drafting exams
      pbi_measure: DynamicMosaicCasesDrafting (Exam Count) = Mosaic Drafting Ct
      pbi_expr: SUM(CASE WHEN p.mosaic_draft_flag = 1 THEN p.Case_Count ELSE 0 END)
      mv_measure: Drafting Exam Count
      kind: count
    - id: pct_rpce_drafting
      label: '% of RPCE (Drafting)'
      pbi_measure: "'% of RPCE_drafting'"
      pbi_expr: "SUM(CASE WHEN p.mosaic_draft_flag = 1 THEN p.Case_Count ELSE 0 END) / SUM(CASE WHEN p.Source_System_Code IN ('rpceMidwest','rpceSouthwest') THEN 1 ELSE 0 END) + 0.02"
      mv_measure: Pct RPCE Drafting
      kind: pct
    - id: capture_exams
      label: Mosaic capture exams
      pbi_measure: DynamicMosaicCasescapture (Exam Count) = MosaicCaptureCt
      pbi_expr: "COUNT_IF(p.mosaic_draft_flag = 1 AND p.Mosaic_flag = 1 AND NULLIF(p.Mexproc, '') IS NOT NULL)"
      mv_measure: Captured Exam Count
      kind: count
    - id: pct_rpce_capture
      label: '% of RPCE (Capture)'
      pbi_measure: "'% of RPCE_capture'"
      pbi_expr: "COUNT_IF(p.mosaic_draft_flag = 1 AND p.Mosaic_flag = 1 AND NULLIF(p.Mexproc, '') IS NOT NULL) / SUM(CASE WHEN p.Source_System_Code IN ('rpceMidwest','rpceSouthwest') THEN 1 ELSE 0 END) + 0.02"
      mv_measure: Pct RPCE Capture
      kind: pct
    - id: mosaic_rads
      label: '# of Mosaic Rads'
      pbi_measure: "'# of Mosaic Rads' (DISTINCTCOUNT Provider name)"
      pbi_expr: COUNT(DISTINCT CASE WHEN p.Mosaic_flag = 1 THEN p.Radiologist END)
      mv_measure: Mosaic Radiologist Count
      kind: count
    - id: rpce_rads
      label: '# of RPCE Rads'
      pbi_measure: "'# of RPCE Rads' (DISTINCTCOUNT Provider name)"
      pbi_expr: "COUNT(DISTINCT CASE WHEN p.Source_System_Code IN ('rpceMidwest','rpceSouthwest') THEN p.Radiologist END)"
      mv_measure: RPCE Radiologist Count
      kind: count
    - id: pct_rads
      label: '% of Rads'
      pbi_measure: "'% of Rads'"
      pbi_expr: "COUNT(DISTINCT CASE WHEN p.Mosaic_flag = 1 THEN p.Radiologist END) / COUNT(DISTINCT CASE WHEN p.Source_System_Code IN ('rpceMidwest','rpceSouthwest') THEN p.Radiologist END)"
      mv_measure: Pct Mosaic Of RPCE Radiologists
      kind: pct
    - id: drafting_rads
      label: Radiologists live on drafting
      pbi_measure: totalradslivedrafting (DISTINCTCOUNT NPI)
      pbi_expr: COUNT(DISTINCT CASE WHEN p.mosaic_draft_flag = 1 THEN p.NPI END)
      mv_measure: Drafting Radiologist Count
      kind: count
    - id: pct_head_ct_rpce
      label: '% Head CT RPCE'
      pbi_measure: Pct_ct_head_rpce
      pbi_expr: "COUNT_IF(p.Clinical_Procedure_Code = 'RPID22' AND p.Source_System_Code IN ('rpceMidwest','rpceSouthwest')) / COUNT_IF(p.Clinical_Procedure_Code = 'RPID22')"
      mv_measure: Pct Head CT RPCE
      kind: pct
  # Documented, intentional differences. A BUG/MISSING row becomes KNOWN DIVERGENCE only when the
  # runner re-compares with every adjustment below applied (pbi_expr_alt on the PBI side, mv_where on
  # ours) and the result is then MATCH/NEAR -- so a waiver can never hide an unrelated new gap.
  # `waive` entries have no adjustment and are pinned to exact member/month with a max_abs_diff cap.
  known_divergences:
    - id: imagine_non_rpce
      kpis: [exams]
      mv_where: "`Source System Code` NOT LIKE 'Imagine-%'"
      reason: >-
        Imagine-* source systems (Imagine-SAPA, Imagine-MIAB, Imagine-MBBAC, ...) are in tbl_exam_inventory
        but not in PBI's exam_fact. They are non-RPCE, so every RPCE KPI and % is unaffected; only the
        all-source Clinical exams count is higher (RP RAH exists only because of them).
    - id: case_count_weighting
      kpis: [exams, drafting_exams, pct_rpce_drafting]
      pbi_expr_alt:
        exams: COUNT(*)
        drafting_exams: COUNT_IF(p.mosaic_draft_flag = 1)
        pct_rpce_drafting: "COUNT_IF(p.mosaic_draft_flag = 1) / SUM(CASE WHEN p.Source_System_Code IN ('rpceMidwest','rpceSouthwest') THEN 1 ELSE 0 END) + 0.02"
      reason: >-
        PBI sums [Exam Ct] (exam_fact.Case_Count), so a multi-case exam counts 2+; the metric view
        counts exams. PBI's % of RPCE (Drafting) also divides that case-weighted numerator by an
        exam-count denominator. Not replicated: it needs exam_fact joined into the view, and the
        exam count is the consistent definition. Visible only in small practices (RP Chicago, DR).
    - id: rp_houston_exam_fact_gap_2026_08
      kpis: [exams, rpce_exams, mosaic_exams, capture_exams]
      waive: {members: [RP Houston], months: ['2026-08'], max_abs_diff: 50}
      reason: >-
        ~27 rpceSouthwest exams (21 of them Mosaic; Aug 2026, valid NPI/team/site) are in tbl_exam_inventory but absent
        from PBI's exam_fact entirely -- a source-load gap on the PBI side, not a logic difference.

# Tier B -- run in PowerBI Desktop (DAX) once the .pbix is open; see README in this folder.
efficiency:
  pbi_report: Mosaic Efficiency
  reference: dax
  metric_view: edw_test.enterprise_analytics.mosaic_efficiency_metric_view
  kpis:
    - {id: full_mosaic_pct_change, label: Full Mosaic % change vs baseline, pbi_measure: Pct_Change_Metric_Opt, mv_measure: Full Mosaic Pct Change Vs Baseline, kind: pct}
    - {id: implied_rts, label: Implied read-time savings, pbi_measure: Implied_RTS_Opt, mv_measure: Full Mosaic Implied Read Time Savings Pct, kind: pct}
    - {id: drafting_pct_change, label: Drafting % change vs baseline, pbi_measure: Pct_Change_Metric_Opt (Mode=Drafting), mv_measure: Drafting Pct Change Vs Baseline, kind: pct}
    - {id: eff_vs_rp_avg, label: Efficiency vs RP average, pbi_measure: Efficiency_vs_RP_Avg_NB, mv_measure: Efficiency Vs RP Avg, kind: pct}
# Capacity = PBI Mosaic Impact Report, "Practice Summary" page at its defaults: Unit = TBWU 26/Shift,
# Shifts with Baselines, report shift-length filter, Rank_TopN = All Shifts (044a in_pbi_default), and the
# visual filter Has_Baseline_For_Selected_Unit = 1 per Local Practice x month. Dashboard reads
# tools/lakeview_exec_dashboard/capacity_practice_summary.sql; Genie reads the 044b metric view.
capacity:
  pbi_report: Mosaic Impact Report (Practice Summary)
  reference: dax
  metric_view: edw_test.enterprise_analytics.mosaic_capacity_pbi_metric_view
  dashboard_dataset: tools/lakeview_exec_dashboard/capacity_practice_summary.sql
  group_filter: "Has TBWU26 Baseline = 1 per Local Practice x Month"
  kpis:
    - {id: shifts, label: Selected shifts, pbi_measure: "Selected Shift Ct", mv_measure: Selected Shift Count, kind: count}
    - {id: avg_baseline, label: Average baseline (TBWU 26/shift), pbi_measure: "Average Baseline", mv_measure: Average Baseline, kind: num}
    - {id: new_capacity, label: New capacity (TBWU 26/shift), pbi_measure: "New Capacity", mv_measure: New Capacity, kind: num}
    - {id: addl_per_shift, label: "Add'l capacity per shift", pbi_measure: "Add'l Capacity/Shift", mv_measure: Addl Capacity Per Shift, kind: num}
    - {id: pct_addl, label: "% add'l capacity", pbi_measure: "% Add'l Capacity", mv_measure: Pct Addl Capacity, kind: pct}
    - {id: pct_mosaic, label: "% Mosaic", pbi_measure: "% Mosaic", mv_measure: Pct Mosaic, kind: pct}
    - {id: pct_drafting, label: "% Mosaic drafting", pbi_measure: "% Mosaic Drafting", mv_measure: Pct Mosaic Drafting, kind: pct}
    - {id: new_efficiency, label: New efficiency, pbi_measure: "New Efficiency", mv_measure: New Efficiency, kind: num}
    - {id: new_utilization, label: New utilization, pbi_measure: "New Utilization", mv_measure: New Utilization, kind: pct}
  notes: >-
    PBI's Time Series page uses RPWU25_per_9hours utilization with Data Quality = Good; the dashboard keeps the
    Practice Summary definition (TBWU 26/Shift) everywhere so all capacity numbers share one unit.
program:
  reference: source_table
  check: tools/mosaic_validation/validate_program.sql
draftable:
  reference: source_table
  check: legacy edw view examsnotdraftedbutdraftable_vw (matched in build)
