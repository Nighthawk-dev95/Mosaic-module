<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosaic Intelligence</title>
    <script>
      // No-FOUC theme guard - set data-theme before first paint so a saved light
      // preference doesn't flash dark on load. Mirrors PCC's own guard script.
      (function () {
        try {
          var theme = localStorage.getItem("mosaic_theme_v1") || "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
